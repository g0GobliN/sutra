name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # peaceiris/actions-gh-pages pushes the results branch
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: pip install tiktoken zstandard
      - name: Run benchmarks
        run: python3 bench/run_benchmarks.py
      - name: Verify artifacts
        run: python3 bench/run_benchmarks.py --check
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.python }}
          path: |
            bench/run_benchmarks.md
            bench/run_benchmarks.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Assemble the results page
        if: matrix.python == '3.13'
        run: |
          mkdir -p gh-pages
          cp bench/run_benchmarks.json gh-pages/results.json
          python3 -c "import html, pathlib; report = pathlib.Path('bench/run_benchmarks.md').read_text(encoding='utf-8'); page = '<!doctype html><meta charset=\"utf-8\"><title>SUTRA benchmarks</title><h1>SUTRA benchmarks</h1><p><a href=\"results.json\">results.json</a></p><pre>' + html.escape(report) + '</pre>'; pathlib.Path('gh-pages/index.html').write_text(page, encoding='utf-8')"
      - name: Deploy to GitHub Pages
        if: matrix.python == '3.13' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gh-pages
