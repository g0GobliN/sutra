name: Benchmarks

# The measurement matrix runs on every pull request with a read-only token.
# Publishing the results page is a separate job that a pull request cannot
# reach: it needs the measurement job, and its own condition requires a push to
# main. The write permission therefore never exists in a pull-request run.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: pip install tiktoken zstandard
      - name: Run benchmarks
        run: python3 bench/run_benchmarks.py
      - name: Verify artifacts
        run: python3 bench/run_benchmarks.py --check
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results-${{ matrix.python }}
          path: |
            bench/run_benchmarks.md
            bench/run_benchmarks.json
          if-no-files-found: ignore
          retention-days: 30

  # One page, built from the 3.13 measurements, published only from main.
  deploy:
    name: Publish the results page
    needs: benchmark
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: benchmark-results-3.13
          path: results
      - name: Assemble the results page
        run: |
          mkdir -p gh-pages
          cp results/run_benchmarks.json gh-pages/results.json
          python3 - <<'PY'
          import html, pathlib
          report = pathlib.Path("results/run_benchmarks.md").read_text(encoding="utf-8")
          page = (
              '<!doctype html><meta charset="utf-8"><title>SUTRA benchmarks</title>'
              '<h1>SUTRA benchmarks</h1>'
              '<p><a href="results.json">results.json</a></p>'
              f"<pre>{html.escape(report)}</pre>"
          )
          pathlib.Path("gh-pages/index.html").write_text(page, encoding="utf-8")
          PY
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ github.token }}
          publish_dir: gh-pages
