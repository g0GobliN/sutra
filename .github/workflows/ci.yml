name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.2
      - run: ruff check .

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Check out Hermes at the pinned revision
        # Keep the checkout outside the plugin root: the security scan reads
        # every file under the plugin and would flag Hermes' own sources.
        run: |
          git init "$RUNNER_TEMP/hermes-agent"
          git -C "$RUNNER_TEMP/hermes-agent" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$RUNNER_TEMP/hermes-agent" fetch --depth 1 origin 4d04303818b61bf3aa09278af48356315515965b
          git -C "$RUNNER_TEMP/hermes-agent" checkout --detach FETCH_HEAD
      - name: Install Hermes at the pinned revision
        run: pip install -e "$RUNNER_TEMP/hermes-agent"
      - run: hermes plugins validate .

  version:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, lint, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_version.py "$GITHUB_REF_NAME"
