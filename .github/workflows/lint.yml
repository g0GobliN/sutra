name: Lint

# Static validation of the code and of the repository configuration. It is a
# separate workflow from CI so a lint failure never waits behind the OS matrix,
# and it runs on the same triggers, including release tags, so a tag is checked
# as thoroughly as a pull request.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # The pin is the version CI has always used; ruff is not a project
      # dependency, so the linter cannot drift with contributor environments.
      - name: Install the pinned linter and validator
        run: pip install ruff==0.17.2 PyYAML==6.0.3
      - name: Ruff
        run: ruff check .
      - name: Validate the GitHub configuration
        run: python scripts/check_github_config.py --config
