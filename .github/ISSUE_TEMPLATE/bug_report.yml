name: Bug report
description: A result that was mangled, lost, or could not be recovered
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not file security issues here — use **Security → Report a vulnerability**.

        A report with a fixture and the settings in force can be fixed in one commit.
  - type: input
    id: tool
    attributes:
      label: Tool that produced the result
      description: For example `terminal`, `read_file`, or a custom tool.
      placeholder: terminal
    validations:
      required: true
  - type: dropdown
    id: shape
    attributes:
      label: Result shape
      options:
        - plain string
        - dict (say which keys below)
        - list / structured content
        - other
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Fixture
      description: The smallest output that reproduces it. Remove secrets first.
      render: text
    validations:
      required: true
  - type: input
    id: size
    attributes:
      label: Size and settings
      description: Byte size of the result, plus any `SUTRA_*` environment variables in force.
      placeholder: 41 KB; SUTRA_MAX_BYTES=65536
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: recovery
    attributes:
      label: Recovery failure (if any)
      description: The id, the mode, and the response status, if `sutra_restore` failed.
  - type: input
    id: versions
    attributes:
      label: SUTRA and Hermes versions
      placeholder: sutra 0.3.0, hermes 0.22.5
    validations:
      required: true
