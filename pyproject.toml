[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# `sutra` on PyPI is an unrelated water-microbiology package (0.2.2); the
# distribution is `sutra-agent`, the import package and commands stay `sutra`.
name = "sutra-agent"
dynamic = ["version"]
description = "Deterministic tool-output reduction for AI agents, preserving the evidence that matters."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vishal Gurung" }]
keywords = ["ai-agents", "context-compression", "tool-output", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://sutra-alive.vercel.app/"
Repository = "https://github.com/g0GobliN/sutra"
Documentation = "https://github.com/g0GobliN/sutra/blob/main/docs/README.md"
Changelog = "https://github.com/g0GobliN/sutra/blob/main/CHANGELOG.md"
Issues = "https://github.com/g0GobliN/sutra/issues"

[project.scripts]
sutra = "sutra.cli:main"
sutra-mcp = "sutra.mcp:main"
sutra-hook = "sutra.hook:main"

[tool.setuptools]
packages = ["sutra"]
# The wheel is the runtime package only. Naming every bundled file explicitly
# keeps development-only scripts (which share the `scripts/` directory with the
# adapters) out of an install; `include-package-data` would add them back.
include-package-data = false

[tool.setuptools.package-dir]
sutra = "."

[tool.setuptools.dynamic]
version = { attr = "sutra.__version__" }

[tool.setuptools.package-data]
sutra = [
    "plugin.yaml",
    "opencode_plugin.js",
    "scripts/_sutra.py",
    "scripts/sutra-cli.py",
    "scripts/sutra-mcp-server.py",
    "scripts/sutra-claude-code-hook.py",
    "scripts/sutra-codex-hook.py",
]
